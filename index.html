<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#9f1239">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GB">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="stylesheet" href="app.css">
  <title>Galicisches Bahn</title>
</head>
<body>
  <main class="app-shell">
    <div class="dynamic-island"><i></i><span>GB Live</span></div>
    <section id="app" class="app-content" aria-live="polite"></section>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-tab="home" class="nav-item active"><span class="icon">⌂</span><small data-i18n="home">Start</small></button>
      <button data-tab="search" class="nav-item"><span class="icon">⌕</span><small data-i18n="search">Suchen</small></button>
      <button data-tab="tickets" class="nav-item"><span class="icon">▤</span><small data-i18n="tickets">Tickets</small></button>
      <button data-tab="profile" class="nav-item"><span class="icon">◎</span><small data-i18n="profile">Profil</small></button>
    </nav>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
